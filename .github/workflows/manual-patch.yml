name: 1. Manual Patch

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Which patches do you want to patch?'
        required: true
        default: 'Morphe'
        type: choice
        options:
          - Morphe

permissions:
  contents: write

jobs:
  patch_morphe:
    name: Patch Morphe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparing to patch
        uses: ./.github/actions/preparing

      - name: Check github connection
        id: check-gh-morphe
        run: bash src/etc/connection.sh

      - name: Patch apk
        id: patch-morphe
        if: steps.check-gh-morphe.outputs.internet_error == '0'
        run: bash src/build/morphe.sh ${{ matrix.run }}

      - name: Releasing APK files
        id: release-morphe
        if: steps.check-gh-morphe.outputs.internet_error == '0'
        uses: ./.github/actions/release             
